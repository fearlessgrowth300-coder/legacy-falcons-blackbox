name: Emulator guest matrix

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: emulator-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0 ndk;29.0.13846066 platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Analyzer unit test
        run: python3 tools/emulator/analyze_matrix_test.py
      - name: Create a CI-only debug keystore
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=BlackBox Emulator CI,O=BlackBox,C=US"
          echo "CI_DEBUG_KEYSTORE=$RUNNER_TEMP/ci-debug.keystore" >> "$GITHUB_ENV"
      - name: Build orig debug, androidTest, and guest APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOrigDebug :app:assembleOrigDebugAndroidTest \
            -PciDebugSigning=true -PciDebugKeystore="$CI_DEBUG_KEYSTORE" \
            --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: matrix-apks
          path: |
            app/build/outputs/apk/orig/debug/*x86_64*debug.apk
            app/build/outputs/apk/androidTest/orig/debug/*.apk
          if-no-files-found: error

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 28, 29, 30, 31, 33, 34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: matrix-apks
          path: emulator-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM hardware acceleration is available"
          else
            echo "KVM hardware acceleration is NOT available" >&2
            exit 1
          fi
      - name: Run guest soak
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          # The runner's own animation toggle aborts the job when settings
          # returns "Broken pipe" on a just-booted API 30/34 image. The soak
          # script turns animations off and ignores that failure.
          disable-animations: false
          emulator-boot-timeout: 1200
          ram-size: 3072M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ./tools/emulator/run-matrix.sh ${{ matrix.api-level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api-${{ matrix.api-level }}
          path: emulator-logs/
          if-no-files-found: ignore
