name: BlackBox CI

on:
  push:
    branches: [main, private-main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build the debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testOrigDebugUnitTest :app:assembleOrigDebug --no-daemon --max-workers=2
