plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

def suiteKeystorePath = providers.environmentVariable('SHIELD_SUITE_KEYSTORE')
        .orElse(providers.gradleProperty('shieldSuiteKeystore')).orNull
def suiteStorePassword = providers.environmentVariable('SHIELD_SUITE_STORE_PASSWORD')
        .orElse(providers.gradleProperty('shieldSuiteStorePassword')).orNull
def suiteKeyAlias = providers.environmentVariable('SHIELD_SUITE_KEY_ALIAS')
        .orElse(providers.gradleProperty('shieldSuiteKeyAlias')).orNull
def suiteKeyPassword = providers.environmentVariable('SHIELD_SUITE_KEY_PASSWORD')
        .orElse(providers.gradleProperty('shieldSuiteKeyPassword')).orNull
def suiteSigningReady = [suiteKeystorePath, suiteStorePassword, suiteKeyAlias, suiteKeyPassword]
        .every { it != null && !it.toString().trim().isEmpty() }

android {

    namespace 'top.niunaijun.blackboxa'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion = "29.0.13846066"
    defaultConfig {
        applicationId "top.niunaijun.blackbox"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Default identity (the "orig" flavor keeps this). Each variant overrides it.
        // procToken feeds Bcore's stub <process> names ("<pkg>:<procToken><n>"). Keep it in
        // sync with each flavor's black_box_proc_token string resource (read at runtime).
        manifestPlaceholders = [appLabel: "BlackBox", procToken: "p"]
        buildConfigField "String", "VARIANT_TAG", "\"orig\""

        splits {
            abi {
                enable true
                reset()
                
                include 'armeabi-v7a', "arm64-v8a"
                universalApk true
            }
        }
    }

    // ── Build variants ──────────────────────────────────────────────────────
    // Ship the same container under several distinct package names + labels so
    // millions of installs don't all present an identical host identity. Each
    // flavor is a fully separate installable app (own applicationId → own data
    // dir → own bridge authority "${applicationId}.bridge"). VARIANT_TAG lets
    // code branch on the flavor for small behavioral differences.
    flavorDimensions "brand"
    productFlavors {
        orig {
            dimension "brand"
            // keeps the default applicationId / label / tag from defaultConfig
        }
        nova {
            dimension "brand"
            applicationId "com.novspace.box"
            manifestPlaceholders = [appLabel: "NovSpace", procToken: "np"]
            buildConfigField "String", "VARIANT_TAG", "\"nova\""
        }
        vault {
            dimension "brand"
            applicationId "app.cloudvault.multi"
            manifestPlaceholders = [appLabel: "CloudVault", procToken: "cv"]
            buildConfigField "String", "VARIANT_TAG", "\"vault\""
        }
        prism {
            dimension "brand"
            applicationId "io.prismhub.clone"
            manifestPlaceholders = [appLabel: "Prism", procToken: "px"]
            buildConfigField "String", "VARIANT_TAG", "\"prism\""
        }
    }

    signingConfigs {
        suiteRelease {
            if (suiteSigningReady) {
                storeFile new File(suiteKeystorePath)
                storePassword suiteStorePassword
                keyAlias suiteKeyAlias
                keyPassword suiteKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.suiteRelease
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    kotlinOptions {
        jvmTarget = '21'
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "BlackBox-${variant.flavorName}_${variant.versionName}_${output.baseName}.apk"
        }
    }
}

// ── Per-variant native engine lib name ───────────────────────────────────────
// The engine is built once as libblackbox.so, but each variant should ship it under a
// DIFFERENT filename so all 4 don't share the tell-tale "libblackbox.so" in /proc/self/maps
// or the APK's lib dir. Rename the stripped .so right before it's packaged. Keep this map in
// sync with VariantConfig.libName() (Bcore) and NativeCore's System.loadLibrary().
def variantLibBase = [Nova: 'nvspace', Vault: 'cvault', Prism: 'prism']
tasks.configureEach { theTask ->
    def m = (theTask.name =~ /^strip(Nova|Vault|Prism)(Debug|Release)DebugSymbols$/)
    if (m.matches()) {
        def base = variantLibBase[m.group(1)]
        theTask.doLast {
            theTask.outputs.files.each { root ->
                fileTree(root).matching { include '**/libblackbox.so' }.each { f ->
                    def dest = new File(f.parentFile, "lib${base}.so")
                    if (dest.exists()) dest.delete()
                    f.renameTo(dest)
                    println "variant-lib: ${theTask.name} -> ${dest.name}"
                }
            }
        }
    }
}

