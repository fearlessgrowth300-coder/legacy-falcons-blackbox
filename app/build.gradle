gradle.taskGraph.whenReady { graph ->
    def packagesRelease = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(?i).*(assemble|bundle|package|install|publish).*release.*/
    }
    if (packagesRelease) {
        if (!suiteSigningReady) {
            throw new GradleException('Release signing is locked. Set SHIELD_SUITE_KEYSTORE, ' +
                    'SHIELD_SUITE_STORE_PASSWORD, SHIELD_SUITE_KEY_ALIAS, and ' +
                    'SHIELD_SUITE_KEY_PASSWORD (or the matching shieldSuite* Gradle properties).')
        }
        def keyFile = new File(suiteKeystorePath)
        if (!keyFile.isAbsolute() || !keyFile.isFile()) {
            throw new GradleException('SHIELD_SUITE_KEYSTORE must be an existing absolute keystore path.')
        }
    }
}
