apply plugin: 'com.android.library'

android {
    namespace 'top.niunaijun.blackbox'

    compileSdk rootProject.ext.compileSdkVersion


    aidlPackagedList "android/app/IServiceConnection.aidl"
    aidlPackagedList "android/accounts/IAccountManagerResponse.aidl"
    buildFeatures {
        aidl true
    }
    buildFeatures {
        prefab true
        buildConfig true
    }
    defaultConfig {
        minSdkVersion rootProject.ext.minSdk

        // NOTE: the ${procToken} placeholder used by the stub <process> names in this module's
        // manifest is intentionally left UNRESOLVED here (like ${applicationId}) so the consuming
        // app module can set it per build flavor. See app/build.gradle productFlavors.

        consumerProguardFiles "consumer-rules.pro"
        ndk {
            
            abiFilters 'arm64-v8a' , 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            def diagnosticPackage = providers.gradleProperty('diagnosticWebViewPackage').orElse('').get()
            if (!(diagnosticPackage ==~ /[A-Za-z0-9_.]*/)) {
                throw new GradleException('diagnosticWebViewPackage must be a package name')
            }
            buildConfigField 'String', 'DIAGNOSTIC_WEBVIEW_PACKAGE', '"'+diagnosticPackage+'"'
        }
        release {
            buildConfigField 'String', 'DIAGNOSTIC_WEBVIEW_PACKAGE', '""'
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/cpp/Android.mk'
        }
        ndkVersion = "29.0.13846066"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    
    
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:-deprecation" << "-Xlint:-unchecked" << "-Xlint:-rawtypes"
        options.fork = true
        // A 2 GiB compiler worker can exhaust the Windows page file before
        // javac starts on ordinary 8 GiB development machines.  Bcore compiles
        // reliably within this bounded worker and lower thread overhead.
        options.forkOptions.jvmArgs << "-Xmx256m" << "-Xss256k" << "-XX:+UseSerialGC" << "-XX:ActiveProcessorCount=2"
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    lintOptions {

        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable "UnusedResources", 'RestrictedApi'
        textOutput "stdout"
        textReport false
        checkOnly 'NewApi', 'InlinedApi'
    }
}


tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}

// Windows AIDL fix: aidl.exe writes the invoking command line (full Windows paths)
// into the generated .java header comment. A package segment like "...\system\user\"
// becomes "\u" — and javac processes \uXXXX unicode escapes even inside comments, so
// "\user" (u-s-e-r, not hex) fails with "illegal unicode escape". Sanitize the
// machine-generated AIDL stubs (backslash -> forward slash) just before compiling.
afterEvaluate {
    tasks.withType(JavaCompile).configureEach { compileTask ->
        compileTask.doFirst {
            def aidlOut = file("${buildDir}/generated/aidl_source_output_dir")
            if (aidlOut.exists()) {
                aidlOut.eachFileRecurse { f ->
                    if (f.name.endsWith('.java')) {
                        def text = f.getText('UTF-8')
                        if (text.indexOf('\\') >= 0) {
                            f.setText(text.replace('\\', '/'), 'UTF-8')
                        }
                    }
                }
            }
        }
    }
}


dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
  implementation 'com.google.android.material:material:1.3.0'
    implementation(project(":black-reflection"))
    annotationProcessor(project(":compiler"))
    implementation 'androidx.appcompat:appcompat:1.2.0'

    implementation 'com.moandjiezana.toml:toml4j:0.7.2'

    implementation 'com.github.tiann:FreeReflection:3.2.2'

    // ART method hooking (in-process) for per-clone android_id — BlackBox's own
    // ClassInvocationStub settings proxies are dead stubs (null getWho -> NPE), so we
    // hook Settings.Secure.getString directly. Same engine proven in Fingerprint Forge.
    implementation 'top.canyie.pine:core:0.3.0'



    
}
